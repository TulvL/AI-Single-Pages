<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artificial Analysis Intelligence Index vs. Cost</title>
<style>
  :root {
    color-scheme: light;
    --background: #ffffff;
    --foreground: #22252a;
    --muted: #636b74;
    --grid: #e7e9ed;
    --minor-grid: #f2f3f5;
    --border: #c7cbd1;
    --pareto: rgba(255, 222, 74, .75);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: Arial, "Nimbus Sans", Helvetica, sans-serif;
  }
  .page {
    width: min(100%, 1680px);
    margin: 0 auto;
    padding: 28px 30px 36px;
  }
  h1 {
    margin: 0;
    font-size: clamp(30px, 3vw, 46px);
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .subtitle {
    margin: 9px 0 18px;
    color: var(--muted);
    font-size: 15px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 14px;
    align-items: center;
  }
  .legend-button,
  .show-all {
    appearance: none;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 3px 0;
    cursor: pointer;
  }
  .legend-button {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    line-height: 1.3;
    transition: opacity .16s ease, filter .16s ease;
  }
  .legend-button img {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    object-fit: contain;
  }
  .legend-button[aria-pressed="false"] {
    opacity: .26;
    filter: grayscale(1);
  }
  .legend-button:hover { text-decoration: underline; }
  .control-row {
    min-height: 34px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    color: var(--muted);
    font-size: 13px;
  }
  #scale-log, #scale-linear { padding: 3px 6px; border-radius: 4px; }
  #scale-log[aria-pressed="true"], #scale-linear[aria-pressed="true"] { background: #e6f5f4; color: #087e7a; text-decoration: none; font-weight: 700; }
  .show-all { color: var(--foreground); text-decoration: underline; }
  .chart-scroll {
    width: 100%;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
  }
  #chart {
    display: block;
    width: 100%;
    min-width: 1180px;
    height: auto;
  }
  .chart-frame { fill: #fff; stroke: var(--border); stroke-width: 3; }
  .grid-major { stroke: var(--grid); stroke-width: 2; }
  .grid-minor { stroke: var(--minor-grid); stroke-width: 2; }
  .axis-line { stroke: #3d434b; stroke-width: 4; }
  .tick-mark { stroke: #7d848d; stroke-width: 2; }
  .tick-mark.major { stroke: #30363d; stroke-width: 4; }
  .tick-mark.secondary { stroke: #555c65; stroke-width: 3; }
  .tick-mark.tertiary { stroke: #9aa0a8; stroke-width: 2; }
  .tick-text { fill: var(--muted); font-size: 27px; }
  .axis-title { fill: var(--foreground); font-size: 39px; font-weight: 700; }
  .kill-zone { fill: rgba(205, 88, 88, .22); pointer-events: none; }
  .kill-zone[data-visible="false"] { display: none; }
  .pareto-line {
    fill: none;
    stroke: var(--pareto);
    stroke-width: 15;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: none;
  }
  .effort-line {
    fill: none;
    stroke-width: 5;
    stroke-linejoin: round;
    opacity: .46;
  }
  .scenario-line {
    fill: none;
    stroke-width: 4;
    stroke-dasharray: 10 5;
    opacity: .8;
  }
  .leader-halo {
    fill: none;
    stroke: #fff;
    stroke-width: 7;
    stroke-linejoin: round;
  }
  .leader-line {
    fill: none;
    stroke-width: 3;
    stroke-linejoin: round;
    opacity: .58;
  }
  .model-logo { transition: transform .14s ease; transform-box: fill-box; transform-origin: center; }
  .model-label {
    font-size: 29px;
    font-weight: 400;
    dominant-baseline: hanging;
    paint-order: stroke fill;
    stroke: #fff;
    stroke-width: 9;
    stroke-linejoin: round;
  }
  [data-creator] { transition: opacity .16s ease; }
  [data-hidden="true"] { opacity: 0 !important; pointer-events: none !important; }
  .hit-target { fill: transparent; pointer-events: all; cursor: crosshair; }
  .hit-target:hover + .model-logo,
  .hit-target:focus + .model-logo { filter: drop-shadow(0 0 3px #72808d); }
  .tooltip {
    position: fixed;
    z-index: 20;
    width: max-content;
    max-width: 320px;
    padding: 10px 12px;
    border: 1px solid #d8dbe0;
    border-radius: 7px;
    background: rgba(255,255,255,.97);
    color: var(--foreground);
    box-shadow: 0 8px 28px rgba(28,35,45,.13);
    font-size: 13px;
    line-height: 1.45;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .1s ease, transform .1s ease;
  }
  .tooltip.visible { opacity: 1; transform: translateY(0); }
  .tooltip strong { display: block; margin-bottom: 3px; font-size: 14px; }
  .tooltip .creator { margin-bottom: 7px; }
  .tooltip dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; }
  .tooltip dt { color: var(--muted); }
  .tooltip dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 700px) {
    .page { padding: 20px 16px 28px; }
    h1 { font-size: 28px; }
    .control-row { align-items: flex-start; flex-direction: column; gap: 3px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }

  /* 与 SVG 纵轴线对齐；窄屏按图表 1180px 最小宽度计算。 */
  .page > header { padding-left: max(58.19178082191781px, 4.931506849315069%); }
  .control-row { column-gap: 28px; row-gap: 10px; justify-content: flex-start; }
  .control-row > span { display: inline-flex; align-items: center; flex-wrap: wrap; column-gap: 10px; row-gap: 8px; }
  #scale-log, #scale-linear { flex: 0 0 44px; width: 44px; height: 28px; font-weight: 700; line-height: 20px; }
  .control-row .labels-toggle {
    display: inline-flex; align-items: center; gap: 10px;
    height: 30px; padding: 4px 10px; margin: 0 10px 0 0;
    border: 1px solid #dce3e7; border-radius: 7px; background: #f7f9fa;
    color: #46525c; font-weight: 500; white-space: nowrap; cursor: pointer;
    transition: background-color 140ms ease, border-color 140ms ease;
  }
  .control-row .labels-toggle:hover { background: #eef3f4; border-color: #bdcdd0; }
  #show-labels {
    appearance: none; position: relative; flex: 0 0 28px;
    width: 28px; height: 16px; margin: 0; border: 0; border-radius: 10px;
    background: #b8c1c8; cursor: pointer; transition: background-color 160ms ease;
  }
  #show-labels::after {
    content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: white; box-shadow: 0 1px 2px #0002;
    transition: transform 160ms cubic-bezier(.4, 0, .2, 1);
  }
  #show-labels:checked { background: #278b87; }
  #show-labels:checked::after { transform: translateX(12px); }
  #show-labels:focus-visible { outline: 2px solid #278b87; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    #show-labels, #show-labels::after, .control-row .labels-toggle { transition: none; }
  }
  .control-row #status { margin-left: 8px; min-width: 172px; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("chart");
const activeCreators = new Set(DATA.creators.map(d => d.name));
const byId = new Map(DATA.models.map(d => [d.id, d]));
let selectedPointId = null;

function svgEl(name, attrs = {}, parent = svg) {
  const node = document.createElementNS(NS, name);
  for (const [key, value] of Object.entries(attrs)) {
    if (value !== null && value !== undefined) node.setAttribute(key, String(value));
  }
  parent.appendChild(node);
  return node;
}

function layer(id, clip = false) {
  return svgEl("g", { id, ...(clip ? { "clip-path": "url(#plot-clip)" } : {}) });
}

function drawStaticChart() {
  const d = DATA.dimensions;
  const defs = svgEl("defs");
  const clip = svgEl("clipPath", { id: "plot-clip" }, defs);
  svgEl("rect", { x: d.plotLeft, y: d.plotTop, width: d.plotRight - d.plotLeft, height: d.plotBottom - d.plotTop }, clip);

  const axes = layer("axes");
  svgEl("rect", { class: "chart-frame", x: d.plotLeft, y: d.plotTop, width: d.plotRight - d.plotLeft, height: d.plotBottom - d.plotTop, rx: 8 }, axes);

  for (let score = DATA.domain.ymin; score <= DATA.domain.ymax; score += 1) {
    const y = d.plotBottom - (score - DATA.domain.ymin) / (DATA.domain.ymax - DATA.domain.ymin) * (d.plotBottom - d.plotTop);
    if (score % 5 === 0) {
      svgEl("line", { class: "grid-major", x1: d.plotLeft, y1: y, x2: d.plotRight, y2: y }, axes);
      svgEl("line", { class: "tick-mark secondary", x1: d.plotLeft - 18, y1: y, x2: d.plotLeft, y2: y }, axes);
      const text = svgEl("text", { class: "tick-text", x: d.plotLeft - 24, y: y + 9, "text-anchor": "end" }, axes);
      text.textContent = score;
    } else {
      svgEl("line", { class: "tick-mark", x1: d.plotLeft - 10, y1: y, x2: d.plotLeft, y2: y }, axes);
    }
  }

  buildHorizontalTicks(axes);

  svgEl("line", { class: "axis-line", x1: d.plotLeft, y1: d.plotBottom, x2: d.plotRight, y2: d.plotBottom }, axes);
  svgEl("line", { class: "axis-line", x1: d.plotLeft, y1: d.plotTop, x2: d.plotLeft, y2: d.plotBottom }, axes);
  const xTitle = svgEl("text", { id: "x-axis-title", class: "axis-title", x: (d.plotLeft + d.plotRight) / 2, y: 2825, "text-anchor": "middle" }, axes);
  xTitle.textContent = "Cost per Intelligence Index Task (USD, log scale)";
  const yTitle = svgEl("text", { class: "axis-title", x: 218, y: (d.plotTop + d.plotBottom) / 2, "text-anchor": "middle", transform: `rotate(-90 218 ${(d.plotTop + d.plotBottom) / 2})` }, axes);
  yTitle.textContent = "Artificial Analysis Intelligence Index (linear scale)";
}

function fillLogoHoles(dataUrl) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0);
      const frame = context.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = frame.data;
      const width = canvas.width;
      const height = canvas.height;
      const exterior = new Uint8Array(width * height);
      const queue = [];
      const enqueue = index => {
        if (!exterior[index] && pixels[index * 4 + 3] <= 24) {
          exterior[index] = 1;
          queue.push(index);
        }
      };
      for (let x = 0; x < width; x++) {
        enqueue(x);
        enqueue((height - 1) * width + x);
      }
      for (let y = 0; y < height; y++) {
        enqueue(y * width);
        enqueue(y * width + width - 1);
      }
      for (let cursor = 0; cursor < queue.length; cursor++) {
        const index = queue[cursor];
        const x = index % width;
        const y = Math.floor(index / width);
        if (x > 0) enqueue(index - 1);
        if (x + 1 < width) enqueue(index + 1);
        if (y > 0) enqueue(index - width);
        if (y + 1 < height) enqueue(index + width);
      }
      for (let index = 0; index < width * height; index++) {
        if (exterior[index]) continue;
        const offset = index * 4;
        const alpha = pixels[offset + 3];
        if (alpha === 255) continue;
        const ratio = alpha / 255;
        pixels[offset] = Math.round(pixels[offset] * ratio + 255 * (1 - ratio));
        pixels[offset + 1] = Math.round(pixels[offset + 1] * ratio + 255 * (1 - ratio));
        pixels[offset + 2] = Math.round(pixels[offset + 2] * ratio + 255 * (1 - ratio));
        pixels[offset + 3] = 255;
      }
      context.putImageData(frame, 0, 0);
      const padding = 2;
      const outlinedCanvas = document.createElement("canvas");
      outlinedCanvas.width = width + padding * 2;
      outlinedCanvas.height = height + padding * 2;
      const outlinedContext = outlinedCanvas.getContext("2d");
      const outlineFrame = outlinedContext.createImageData(
        outlinedCanvas.width,
        outlinedCanvas.height
      );
      for (let sourceIndex = 0; sourceIndex < width * height; sourceIndex++) {
        const alpha = pixels[sourceIndex * 4 + 3];
        if (alpha <= 24) continue;
        const sourceX = sourceIndex % width;
        const sourceY = Math.floor(sourceIndex / width);
        for (let offsetY = -padding; offsetY <= padding; offsetY++) {
          for (let offsetX = -padding; offsetX <= padding; offsetX++) {
            if (offsetX * offsetX + offsetY * offsetY > padding * padding) continue;
            const targetX = sourceX + padding + offsetX;
            const targetY = sourceY + padding + offsetY;
            const targetOffset = (targetY * outlinedCanvas.width + targetX) * 4;
            outlineFrame.data[targetOffset] = 255;
            outlineFrame.data[targetOffset + 1] = 255;
            outlineFrame.data[targetOffset + 2] = 255;
            outlineFrame.data[targetOffset + 3] = Math.max(
              outlineFrame.data[targetOffset + 3], alpha
            );
          }
        }
      }
      outlinedContext.putImageData(outlineFrame, 0, 0);
      outlinedContext.drawImage(canvas, padding, padding);
      resolve(outlinedCanvas.toDataURL("image/png"));
    };
    image.onerror = () => resolve(dataUrl);
    image.src = dataUrl;
  });
}

async function prepareLogos() {
  for (const creator of Object.keys(DATA.logos)) {
    DATA.logos[creator] = await fillLogoHoles(DATA.logos[creator]);
  }
}

function buildLegend() {
  const legend = document.getElementById("legend");
  for (const creator of DATA.creators) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "legend-button";
    button.dataset.vendor = creator.name;
    button.setAttribute("aria-pressed", "true");
    button.style.color = creator.color;
    const img = document.createElement("img");
    img.src = DATA.logos[creator.name];
    img.alt = "";
    button.append(img, document.createTextNode(`${creator.display} ${creator.count}`));
    button.addEventListener("click", () => {
      if (activeCreators.has(creator.name)) activeCreators.delete(creator.name);
      else activeCreators.add(creator.name);
      updateVisibility();
    });
    legend.appendChild(button);
  }
  document.getElementById("show-all").addEventListener("click", () => {
    DATA.creators.forEach(d => activeCreators.add(d.name));
    updateVisibility();
  });
}

function effortRank(value) {
  return Object.prototype.hasOwnProperty.call(DATA.effortOrder, value) ? DATA.effortOrder[value] : 0;
}

function buildDataLayers() {
  const paretoLayer = layer("pareto-layer", true);
  svgEl("path", { id: "pareto-line", class: "pareto-line" }, paretoLayer);

  const effortLayer = layer("effort-layer", true);
  const grouped = new Map();
  for (const model of DATA.models) {
    if (!grouped.has(model.group)) grouped.set(model.group, []);
    grouped.get(model.group).push(model);
  }
  for (const members of grouped.values()) {
    if (members.length < 2) continue;
    members.sort((a, b) => effortRank(a.effort) - effortRank(b.effort) || a.cost - b.cost || a.score - b.score);
    const creator = members[0].creator;
    svgEl("polyline", {
      class: "effort-line vendor-element",
      "data-members": members.map(d => d.id).join(" "),
      points: members.map(d => `${d.x},${d.y}`).join(" "),
      stroke: DATA.colors[creator],
      "data-creator": creator
    }, effortLayer);
  }

  const scenarioLineLayer = layer("scenario-line-layer", true);
  for (const scenario of DATA.scenarios) {
    const peak = byId.get(scenario.peakId);
    svgEl("line", {
      class: "scenario-line vendor-element",
      "data-scenario-id": scenario.id,
      x1: scenario.x + 12,
      y1: scenario.y,
      x2: peak.x - 11,
      y2: peak.y,
      stroke: DATA.colors.DeepSeek,
      "data-creator": "DeepSeek"
    }, scenarioLineLayer);
  }

  const leaderLayer = layer("leader-layer");
  const allPoints = [...DATA.models, ...DATA.scenarios];
  for (const point of allPoints) {
    const leaderOpacity = point.leader ? 1 : 0;
    svgEl("path", { class: "leader-halo vendor-element", d: point.leader, "data-leader-id": point.id, opacity: leaderOpacity, "data-creator": point.creator }, leaderLayer);
    svgEl("path", { class: "leader-line vendor-element", d: point.leader, "data-leader-id": point.id, opacity: leaderOpacity, stroke: DATA.colors[point.creator], "data-creator": point.creator }, leaderLayer);
  }

  const markerLayer = layer("marker-layer");
  for (const point of allPoints) {
    const group = svgEl("g", { class: "vendor-element", "data-creator": point.creator }, markerLayer);
    const hit = svgEl("circle", { class: "hit-target", cx: point.x, cy: point.y, r: 24, "data-point-id": point.id, tabindex: 0, role: "button", "aria-label": `${point.shortName}, ${point.creatorDisplay}` }, group);
    const logo = svgEl("image", { class: "model-logo", x: point.x - 18, y: point.y - 18, width: 36, height: 36, href: DATA.logos[point.creator], preserveAspectRatio: "xMidYMid meet", "pointer-events": "none" }, group);
    hit.addEventListener("pointerenter", event => showTooltip(event, point));
    hit.addEventListener("pointermove", moveTooltip);
    hit.addEventListener("pointerleave", hideTooltip);
    hit.addEventListener("focus", event => showTooltip(event, point));
    hit.addEventListener("blur", hideTooltip);
    hit.addEventListener("click", event => { event.stopPropagation(); toggleKillZone(point); });
    hit.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleKillZone(point);
      }
    });
  }

  const labelLayer = layer("label-layer");
  for (const point of allPoints) {
    const text = svgEl("text", {
      class: "model-label vendor-element",
      "data-label-id": point.id,
      x: point.labelX,
      y: point.labelY,
      fill: DATA.colors[point.creator],
      "data-creator": point.creator,
      "pointer-events": "none"
    }, labelLayer);
    text.textContent = point.label;
  }

  const killZoneLayer = layer("kill-zone-layer", true);
  svgEl("rect", { id: "kill-zone", class: "kill-zone", "data-visible": "false" }, killZoneLayer);
}

function toggleKillZone(point) {
  selectedPointId = selectedPointId === point.id ? null : point.id;
  updateKillZone();
}

function updateKillZone() {
  const zone = document.getElementById("kill-zone");
  const point = [...DATA.models, ...DATA.scenarios].find(d => d.id === selectedPointId);
  if (!point || !activeCreators.has(point.creator)) {
    selectedPointId = null;
    zone.dataset.visible = "false";
    return;
  }
  const dimensions = DATA.dimensions;
  zone.setAttribute("x", point.x);
  zone.setAttribute("y", point.y);
  zone.setAttribute("width", Math.max(0, dimensions.plotRight - point.x));
  zone.setAttribute("height", Math.max(0, dimensions.plotBottom - point.y));
  zone.dataset.visible = "true";
}

function visiblePoints() {
  return [...DATA.models, ...DATA.scenarios].filter(d => activeCreators.has(d.creator));
}

function updatePareto() {
  const points = visiblePoints().slice().sort((a, b) => a.cost - b.cost || b.score - a.score);
  const front = [];
  let best = -Infinity;
  for (const point of points) {
    if (point.score > best + 1e-9) {
      front.push(point);
      best = point.score;
    }
  }
  document.getElementById("pareto-line").setAttribute("d", front.length ? `M ${front.map(d => `${d.x} ${d.y}`).join(" L ")}` : "");
}

function updateVisibility() {
  document.querySelectorAll("[data-creator]").forEach(element => {
    element.dataset.hidden = activeCreators.has(element.dataset.creator) ? "false" : "true";
  });
  document.querySelectorAll(".legend-button").forEach(button => {
    button.setAttribute("aria-pressed", activeCreators.has(button.dataset.vendor) ? "true" : "false");
  });
  const visibleModels = DATA.models.filter(d => activeCreators.has(d.creator)).length;
  document.getElementById("status").textContent = `已显示 ${visibleModels} / ${DATA.models.length} 个模型`;
  updatePareto();
  updateKillZone();
  hideTooltip();
}

function formatCost(value) {
  return `$${value.toFixed(2)}`;
}

const tooltip = document.getElementById("tooltip");
function showTooltip(event, point) {
  const effort = point.effort && !["r", "nr"].includes(point.effort.toLowerCase())
    ? point.effort
    : (point.shortName.match(/\((minimal|low|medium|high|xhigh|max)(?:,|\))/i)?.[1] || "");
  const title = point.shortName.replace(/\((minimal|low|medium|high|xhigh|max)\)/gi, "").replace(/\((minimal|low|medium|high|xhigh|max),\s*/gi, "(").trim();
  const escape = value => String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
  tooltip.innerHTML = '<strong>' + escape(title) + '</strong><div class="creator" style="color:' + DATA.colors[point.creator] + '">' + escape(point.creatorDisplay) + (point.scenario ? ' · off-peak' : '') + '</div><dl>'
    + (effort ? '<dt>Reasoning effort</dt><dd>' + escape(effort) + '</dd>' : '')
    + '<dt>Intelligence Index</dt><dd>' + point.score.toFixed(0) + '</dd><dt>Task cost</dt><dd>' + formatCost(point.cost) + '</dd><dt>Mode</dt><dd>' + (point.reasoning ? 'Reasoning' : 'Non-reasoning') + '</dd></dl>';
  tooltip.classList.add("visible");
  tooltip.setAttribute("aria-hidden", "false");
  moveTooltip(event);
}

function moveTooltip(event) {
  const x = Number.isFinite(event.clientX) ? event.clientX : window.innerWidth / 2;
  const y = Number.isFinite(event.clientY) ? event.clientY : window.innerHeight / 2;
  const gap = 14;
  const rect = tooltip.getBoundingClientRect();
  let left = x + gap;
  let top = y + gap;
  if (left + rect.width > window.innerWidth - 8) left = x - rect.width - gap;
  if (top + rect.height > window.innerHeight - 8) top = y - rect.height - gap;
  tooltip.style.left = `${Math.max(8, left)}px`;
  tooltip.style.top = `${Math.max(8, top)}px`;
}

function hideTooltip() {
  tooltip.classList.remove("visible");
  tooltip.setAttribute("aria-hidden", "true");
}

document.getElementById("page-title").textContent = DATA.title;
document.getElementById("page-subtitle").textContent = DATA.subtitle;
const allScalePoints = [...DATA.models, ...DATA.scenarios];
const linearMaxCost = Math.max(...allScalePoints.map(p => p.cost));
const scaleOrigins = new Map(allScalePoints.map(p => [p.id, { x: p.x, labelX: p.labelX, labelY: p.labelY, leader: p.leader }]));
let scaleProgress = 0;
let scaleFrame = null;
let targetScale = "log";
const tickNodes = [];
let linearLayouts = null;
let scaleBindings = null;

function prepareScaleAnimation() {
  if (!linearLayouts) linearLayouts = prepareLinearLayouts();
  if (!scaleBindings) scaleBindings = new Map(allScalePoints.map(point => [point.id, {
    marker: document.querySelector('[data-point-id="' + point.id + '"]').parentNode,
    label: document.querySelector('[data-label-id="' + point.id + '"]'),
    leaders: [...document.querySelectorAll('[data-leader-id="' + point.id + '"]')]
  }]));
}

function easeScale(t) {
  // cubic-bezier(.4, 0, .2, 1)：柔和起步、快速展开、平稳收尾。
  if (t <= 0 || t >= 1) return t;
  let low = 0, high = 1;
  for (let i = 0; i < 18; i++) {
    const u = (low + high) / 2, v = 1 - u;
    const x = 3 * v * v * u * .4 + 3 * v * u * u * .2 + u * u * u;
    if (x < t) low = u; else high = u;
  }
  const u = (low + high) / 2;
  return u * u * (3 - 2 * u);
}

function scaleX(cost, progress = scaleProgress) {
  const d = DATA.dimensions, domain = DATA.domain;
  const logFraction = Math.log(cost / domain.xmin) / Math.log(domain.xmax / domain.xmin);
  // 线性轴从零开始，保证价格之间的距离和比例可直接比较。
  const linearFraction = cost / linearMaxCost;
  return d.plotLeft + (logFraction * (1 - progress) + linearFraction * progress) * (d.plotRight - d.plotLeft);
}

function buildHorizontalTicks(axes) {
  const d = DATA.dimensions;
  const makeTick = (value, kind, text, mode) => {
    const group = svgEl("g", {}, axes);
    if (kind === "major") svgEl("line", { class: "grid-minor", x1: 0, x2: 0, y1: d.plotTop, y2: d.plotBottom }, group);
    if (!text) svgEl("line", { class: "tick-mark " + kind, x1: 0, x2: 0, y1: d.plotBottom, y2: d.plotBottom + ({ major: 30, secondary: 24, tertiary: 17 }[kind]) }, group);
    else svgEl("text", { class: "tick-text", x: 0, y: d.plotBottom + 69, "text-anchor": "middle" }, group).textContent = text;
    tickNodes.push({ group, value, mode });
  };
  for (const kind of ["major", "secondary", "tertiary"]) for (const tick of DATA.ticks[kind]) makeTick(tick.value, kind, null, "log");
  for (const tick of DATA.ticks.labels) makeTick(tick.value, "label", tick.text, "log");
  const rough = linearMaxCost / 8;
  const magnitude = 10 ** Math.floor(Math.log10(rough));
  const step = [1, 2, 2.5, 5, 10].map(n => n * magnitude).find(n => n >= rough);
  for (let i = 0; i * step < linearMaxCost - step * 0.25; i++) {
    const value = i * step;
    makeTick(value, "major", null, "linear");
    makeTick(value, "label", "$" + Number(value.toPrecision(4)), "linear");
  }
  makeTick(linearMaxCost, "major", null, "linear");
  makeTick(linearMaxCost, "label", "$" + Number(linearMaxCost.toFixed(2)), "linear");
  updateHorizontalTicks();
}

function updateHorizontalTicks() {
  for (const tick of tickNodes) {
    // 零点没有对数坐标；它固定在线性轴原点并随切换淡入。
    const x = tick.value === 0 ? DATA.dimensions.plotLeft : scaleX(tick.value);
    tick.group.setAttribute("transform", "translate(" + x + " 0)");
    tick.group.setAttribute("opacity", tick.mode === "log" ? 1 - scaleProgress : scaleProgress);
  }
}

function prepareLinearLayouts() {
  const d = DATA.dimensions;
  const occupied = [];
  const marks = allScalePoints.map(p => ({ x: scaleX(p.cost, 1), y: p.y }));
  const layouts = new Map();
  const overlap = (a, b) => a.x < b.x + b.width + 8 && a.x + a.width + 8 > b.x && a.y < b.y + b.height + 8 && a.y + a.height + 8 > b.y;
  // 线性尺度下低价点更密集，重新避让文字；点本身严格按价格定位。
  for (const p of allScalePoints.slice().sort((a, b) => b.score - a.score || a.cost - b.cost)) {
    const label = document.querySelector('[data-label-id="' + p.id + '"]');
    const width = label.getComputedTextLength(), height = 34;
    const x = scaleX(p.cost, 1);
    const origin = scaleOrigins.get(p.id);
    const desiredX = Math.max(d.plotLeft + 8, Math.min(d.plotRight - width - 8, origin.labelX + x - origin.x));
    const candidates = [];
    for (let row = -20; row <= 20; row++) for (let column = -4; column <= 10; column++) {
      const box = { x: desiredX + column * 180, y: origin.labelY + row * 44, width, height };
      if (box.x < d.plotLeft + 8 || box.x + width > d.plotRight - 8 || box.y < d.plotTop + 8 || box.y + height > d.plotBottom - 8) continue;
      candidates.push({ ...box, score: Math.abs(row * 44) * 1.5 + Math.abs(column * 180) });
    }
    candidates.sort((a, b) => a.score - b.score);
    const box = candidates.find(box => !occupied.some(other => overlap(box, other)) && !marks.some(mark => overlap(box, { x: mark.x - 20, y: mark.y - 20, width: 40, height: 40 })))
      || { x: desiredX, y: origin.labelY, width, height };
    occupied.push(box);
    const endX = Math.max(box.x, Math.min(box.x + width, x));
    const endY = Math.max(box.y, Math.min(box.y + height, p.y));
    const distance = Math.hypot(endX - x, endY - p.y);
    const inset = Math.min(22, distance / 2);
    const startX = x + (endX - x) * inset / (distance || 1);
    const startY = p.y + (endY - p.y) * inset / (distance || 1);
    layouts.set(p.id, { ...box, leader: [startX, startY, (startX + endX) / 2, (startY + endY) / 2, endX, endY], leaderVisible: distance > 32 });
  }
  return layouts;
}

function renderScale(progress) {
  scaleProgress = progress;
  prepareScaleAnimation();
  for (const point of allScalePoints) {
    const origin = scaleOrigins.get(point.id);
    // 使用原始布局的精确坐标，来回切换不会累积误差。
    point.x = origin.x * (1 - progress) + scaleX(point.cost, 1) * progress;
    const dx = point.x - origin.x;
    const binding = scaleBindings.get(point.id);
    binding.marker.setAttribute("transform", "translate(" + dx + " 0)");
    const label = binding.label;
    const linear = linearLayouts.get(point.id);
    point.labelX = origin.labelX * (1 - progress) + linear.x * progress;
    point.labelY = origin.labelY * (1 - progress) + linear.y * progress;
    label.setAttribute("x", point.labelX);
    label.setAttribute("y", point.labelY);
    binding.leaders.forEach(leader => {
      const initial = origin.leader ? origin.leader.match(/-?\d+(?:\.\d+)?/g).map(Number) : [origin.x, point.y, origin.x, point.y, origin.x, point.y];
      const coords = initial.map((value, i) => value * (1 - progress) + linear.leader[i] * progress);
      leader.setAttribute("d", "M " + coords.slice(0, 2).join(" ") + " Q " + coords.slice(2).join(" "));
      leader.setAttribute("opacity", (origin.leader ? 1 : 0) * (1 - progress) + (linear.leaderVisible ? 1 : 0) * progress);
    });
  }
  document.querySelectorAll("[data-members]").forEach(line => line.setAttribute("points", line.dataset.members.split(" ").map(id => { const p = byId.get(id); return p.x + "," + p.y; }).join(" ")));
  document.querySelectorAll("[data-scenario-id]").forEach(line => {
    const p = DATA.scenarios.find(p => p.id === line.dataset.scenarioId), peak = byId.get(p.peakId);
    const inset = Math.min(12, Math.max(0, (peak.x - p.x) / 3));
    line.setAttribute("x1", p.x + inset);
    line.setAttribute("x2", peak.x - inset);
  });
  updateHorizontalTicks();
  updatePareto();
  updateKillZone();
}

function setScale(mode) {
  if (mode === targetScale) return;
  targetScale = mode;
  if (scaleFrame !== null) cancelAnimationFrame(scaleFrame);
  document.getElementById("scale-log").setAttribute("aria-pressed", mode === "log");
  document.getElementById("scale-linear").setAttribute("aria-pressed", mode === "linear");
  document.getElementById("x-axis-title").textContent = "Cost per Intelligence Index Task (USD, " + (mode === "linear" ? "linear" : "log") + " scale)";
  hideTooltip();
  const end = mode === "linear" ? 1 : 0, start = scaleProgress;
  prepareScaleAnimation();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { renderScale(end); scaleFrame = null; return; }
  let started = null;
  const frame = now => {
    // 从首个实际绘制帧计时，防止点击后的排队时间造成起点小跳。
    if (started === null) started = now;
    const t = Math.min(1, (now - started) / 520);
    const eased = easeScale(t);
    renderScale(start + (end - start) * eased);
    scaleFrame = t < 1 ? requestAnimationFrame(frame) : null;
  };
  scaleFrame = requestAnimationFrame(frame);
}

drawStaticChart();
buildLegend();
buildDataLayers();
document.getElementById("hide-all").addEventListener("click", () => { activeCreators.clear(); updateVisibility(); });
document.getElementById("show-labels").addEventListener("change", event => { for (const id of ["label-layer", "leader-layer"]) document.getElementById(id).style.visibility = event.target.checked ? "visible" : "hidden"; });
updateVisibility();
document.getElementById("scale-log").addEventListener("click", () => setScale("log"));
document.getElementById("scale-linear").addEventListener("click", () => setScale("linear"));
</script>
</body>
</html>
